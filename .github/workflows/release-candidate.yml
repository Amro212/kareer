name: Prepare store packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node --test tests/unit/packaging.test.js tests/unit/byok-gate.test.js
      - name: Build production store packages
        env:
          KAREER_GATEWAY_ORIGIN: ${{ vars.KAREER_GATEWAY_ORIGIN }}
        run: node tools/build.js --target=extension --production --amo
      - run: npx --no-install web-ext lint --source-dir=dist/firefox

      - name: Archive the exact reviewer source
        run: |
          git archive --format=zip --output=dist/kareer-amo-source.zip HEAD \
            src tools/build.js tools/zip.js package.json package-lock.json LICENSE README.md SECURITY.md TRADEMARK.md docs/reviewer-build.md

      - uses: actions/upload-artifact@v4
        with:
          name: kareer-store-packages
          if-no-files-found: error
          path: |
            dist/kareer-chrome.zip
            dist/kareer-firefox.xpi
            dist/kareer-amo-source.zip
