<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Job application · Embedded form</title>
<body><h1>Job application</h1><iframe title="Job application" width="900" height="800"></iframe>
<script>
if (new URLSearchParams(location.search).has('mixed')) {
  document.body.dataset.submissions = '0';
  document.querySelector('iframe').insertAdjacentHTML('beforebegin', '<form id="application"><label for="parent-name">Full name</label><input id="parent-name" required><button>Submit application</button></form>');
  document.querySelector('form').onsubmit = event => {
    event.preventDefault();
    if (!event.target.reportValidity()) return;
    document.body.dataset.submissions = String(Number(document.body.dataset.submissions) + 1);
    document.body.innerHTML = '<h1>Application submitted</h1><p>Thank you for applying.</p>';
  };
}
document.querySelector('iframe').src = 'http://embed.kareer.test/generic-application-fixture.html' + location.search;
</script>
</body></html>
