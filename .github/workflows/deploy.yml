name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/core/credits.json'
      - 'src/core/offers.json'
      - 'package.json'
      - 'tools/sync-amo.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    # Keep the existing self-hosted Firefox download and update feed available.
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Stage the approved Firefox download
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if ! node tools/sync-amo.js || [ ! -s site/downloads/kareer-firefox.xpi ]; then
            echo 'Mozilla did not provide an XPI. Carrying forward the published Firefox download and update feed.'
            node tools/sync-amo.js --from-pages
          fi

      - uses: actions/configure-pages@v5
      - run: npm ci --prefix site
      - run: node --test tests/unit/site-build.test.js
      - run: npm run build --prefix site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - uses: actions/deploy-pages@v4
        id: deployment
