<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engineer</title>
  <meta property="og:description" content="Captured application summary.">
  <style>body{font:16px sans-serif;padding:24px}label{display:block;margin:16px 0}input{display:block;padding:8px}</style>
</head>
<!-- Synthetic Lever application for controlled parent-posting requests. -->
<body>
  <h1>Engineer</h1>
  <form>
    <label>Full name<input id="name" name="name" required></label>
    <label>Email<input id="email" name="email" type="email" required></label>
    <button type="submit">Submit application</button>
  </form>
  <script>document.querySelector('form').onsubmit = event => event.preventDefault();</script>
</body>
</html>
