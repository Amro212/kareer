<!doctype html><html lang="en"><meta charset="utf-8"><title>Job Application | Embedded ATS workflow</title>
<!-- Synthetic cross-origin host; fixture submissions stay local. -->
<body><div class="host-controls"><input id="site-search" placeholder="Search jobs"><input id="newsletter" type="email" placeholder="Subscribe to updates"></div><main><h1>Engineer</h1><p>Application hosted below.</p><div id="frames"></div></main>
<script>
const params=new URLSearchParams(location.search);
const frame=document.createElement('iframe');frame.width='900';frame.height='1200';frame.src='http://embed.kareer.test/greenhouse-ashby-workflow.html'+location.search;document.querySelector('#frames').append(frame);
if(params.has('ambiguous'))document.querySelector('#frames').append(frame.cloneNode());
if(params.has('replace'))addEventListener('message',event=>{
 if(event.source!==frame.contentWindow || event.origin!=='http://embed.kareer.test' || event.data!=='fixture-replace')return;
 const next=frame.cloneNode();const url=new URL(next.src);url.searchParams.delete('replace');url.searchParams.set('step2','');next.src=url.href;frame.replaceWith(next);
});
</script></body></html>
