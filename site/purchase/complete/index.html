<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Back from checkout — Kareer</title>
  <link rel="icon" href="/assets/kareer-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1rem; background: #f7f6f0; color: #19201a; font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(100%, 32rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #d1d4c9; border-radius: 1.25rem; background: #fff; }
    .brand { display: flex; align-items: center; gap: .5rem; font-weight: 750; }
    h1 { margin: 1.25rem 0 .75rem; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.1; }
    p { margin: .75rem 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/kareer-mark.svg" width="24" height="24" alt=""> Kareer</div>
    <h1>Back from checkout</h1>
    <p>In the browser you used for checkout, reopen <strong>Kareer → Settings → AI &amp; billing</strong>.</p>
    <p>Kareer verifies your purchase there and shows your available credits.</p>
  </main>
</body>
</html>
