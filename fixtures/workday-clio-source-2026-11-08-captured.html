    <meta name="description" property="og:description" content="Clio is the global leader in legal AI technology, empowering legal professionals and law firms of every size to work smarter, faster, and more securely. We are transforming the legal experience for all by bettering the lives of legal professionals while increasing access to justice. Summary: We are seeking a Software Developer to join our Engineering team at our Toronto Hub. As part of our hybrid model, all hub-based team members are expected to work from the office at least twice per week on designated Anchor Days. What your team does: We at Clio have an amazing team that is on a mission to transform the legal experience for all, and our engineering team’s goal is to deliver an incredible experience to our customers. To enable our engineers to build the best product they can, our development team has to build the best possible product that is performant, reliable, scalable, and beautiful. A day in the life might look like: Work with a team of developers to solve complex problems and provide elegant solutions to Clio customers; Work in an agile environment with our team of full stack developers across a variety of projects; Using a wide variety of technologies, learning new things, and challenging yourself; Participating in diverse projects and collaborating with multiple engineering teams across three countries; Review and provide feedback on a peer's code, both from within your own team or across all of Clio. Thrive as #TeamClio. What you may have: Experience in software development, specifically with building web applications at scale and Ruby on Rails; The ability to master new technologies quickly and work effectively in a dynamic and ever-evolving environment that includes distributed teams and customers; Demonstrated success in mentorship in software development, particularly using an Agile process and with large scale SaaS products; Database optimization experience; Experience working with large-scale systems; A diverse base of knowledge that allows you to help your team solve complex technical problems; Demonstrate a keen interest in improving your craft by using AI; A portfolio of successful projects (as well as a collection of lessons learned from failed projects); and Excellent communication skills and the ability to build trusted relationships with fellow Clions and customers; Demonstrate a keen interest in improving your craft by using AI. Don’t have all of those? The most important part of this job is that you approach new challenges with curiosity and a drive to apply what you learn to fixing root causes, not just symptoms. Deep curiosity and a desire to learn will help you succeed in this job, combined with a drive to help others by shipping code. We have cross-trained developers coming from Java, Python, C++, and JavaScript backgrounds, and are happy to help you learn Ruby when you get here. This posting is for an existing vacancy. What you will find here: Compensation is one of the main components of Clio’s Total Rewards Program. We have developed a series of programs and processes to ensure we are creating fair and competitive pay practices that form the foundation of our human and high-performing culture. Some highlights of our Total Rewards program include: Competitive, equitable salary with top-tier health benefits, dental, and vision insurance Hybrid work environment, with expectation for local Clions (Vancouver, Calgary, Toronto, Dublin, London, New York City and Sydney) to be in office min. twice per week. Flexible time off policy, with an encouraged 20 days off per year. $2000 annual counseling benefit RRSP matching and RESP contribution Clioversary recognition program with special acknowledgement at 3, 5, 7, and 10 years The expected salary range for this role is $112,000 to $151,500 CAD. Initial placement within the range is informed by geographic region, experience, and skillset, with room to progress as impact and tenure grow. Final offer amounts will vary based on candidate profile. Diversity, Inclusion, Belonging and Equity (DIBE) &amp;amp; Accessibility Our team shows up as their authentic selves, and are united by our mission. We are dedicated to diversity, equity and inclusion. We pride ourselves in building and fostering an environment where our teams feel included, valued, and enabled to do the best work of their careers, wherever they choose to log in from. We believe that different perspectives, skills, backgrounds, and experiences result in higher-performing teams and better innovation. We are committed to equal employment and we encourage candidates from all backgrounds to apply. Clio provides accessibility accommodations during the recruitment process. Should you require any accommodation, please let us know and we will work with you to meet your needs. Learn more about our culture at clio.com/careers We're a Human and High Performing AI company, meaning we use artificial intelligence to improve all of our operations. In recruitment, AI helps us streamline the process for greater efficiency. However, we've built our systems to ensure that a human always reviews AI-generated output, and we never make automated hiring decisions. Disclaimer: We only communicate with candidates through official @clio.com email addresses. About Clio Clio is on a mission to transform the legal experience for all. Clio is the global leader in legal AI, building the platform that powers the future of legal work. With the scale, data, and ambition to redefine how the legal industry operates, we are advancing a comprehensive strategy that spans the full lifecycle of legal work—from knowledge and insight to execution and outcomes. At the center of this vision is the Intelligent Legal Work Platform, the legal industry’s first System of Action. By combining Clio’s core product suite with Clio Work and AI-native capabilities, the platform turns information into insight and insight into action. As we expand into the enterprise, Clio for Enterprise extends this foundation to support the complexity, scale, and operational rigor of global organizations through solutions like Clio Operate and Vincent by Clio. Backed by industry-leading data and intelligence, Clio is building the infrastructure that enables legal teams to operate with greater speed, confidence, and impact. Clio’s leadership and momentum have been recognized globally. In 2022, we achieved Centaur status, a milestone reached by fewer than 200 private SaaS companies worldwide. We are a proud honoree of the Forbes Cloud 100 and Fortune’s Future 50, have been named Innovator of the Year, and are a Platinum Club member of Canada’s Best Managed Companies. We are consistently recognized as one of Canada’s Top 100 Employers and a Top Employer for Young People, with our international offices also earning placements on Great Place to Work’s Best Workplaces lists. Headquartered in Vancouver, Canada, Clio has grown to more than 2,000 employees across offices in Toronto, Calgary, Dublin, Manchester, Sydney, Barcelona, and Bogotá—bringing together diverse perspectives to solve one of the world’s most complex and impactful professional challenges. Join Clio and help define the future of legal work through AI. Learn more at clio.com/careers.">
